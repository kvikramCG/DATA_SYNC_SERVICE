server:
  port: 8080
  # Item 8: on SIGTERM stop accepting new requests but let in-flight ones finish, instead of cutting them off.
  shutdown: graceful

spring:
  lifecycle:
    # Upper bound for that drain; keep it below the platform's stop timeout (ECS default 30s).
    timeout-per-shutdown-phase: 25s
  application:
    name: data-sync-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/datasync
    username: ${DB_USERNAME:datasync}
    password: ${DB_PASSWORD:datasync}
    hikari:
      # POOL SIZING DECISION. No transaction stays open during an Orion/LedgerPoint HTTP call
      # (the worker is not @Transactional and open-in-view is off), so a connection is held only for
      # the DB work itself. Orion is limited to 5 requests/s (resilience4j ratelimiter), so at most
      # ~5 month-chunks per second reach the database. Needed connections ~ 5 x the hold time of the
      # largest transaction (the batched value upsert, ~0.5-2 s) = about 3-10. 20 gives ~2x headroom
      # for the API (POST/GET), the reaper and the two series types running together.
      # A bigger pool adds database load, not throughput. Across all instances keep
      # instances x pool below Postgres max_connections (default 100) minus admin/monitoring.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Fixed-size pool (min = max): no cost of growing the pool in the middle of a burst.
      minimum-idle: ${DB_POOL_SIZE:20}
      # Fail fast. With batched writes a wait should be milliseconds; 30 s means the database is in
      # trouble, and a longer timeout would only stack up blocked request/task threads.
      connection-timeout: 30000
      # Recycle connections before any network device can silently drop them. If a firewall, load
      # balancer or pooler (e.g. PgBouncer) in front of Postgres closes idle connections sooner than
      # this, set max-lifetime a few minutes BELOW its timeout.
      max-lifetime: 1800000
      # Periodic validation of idle connections so a dropped connection is replaced instead of
      # being handed to a caller.
      keepalive-time: 300000
      # With batched writes no transaction should hold a connection for 30 s, so anything that does
      # is a leak; Hikari logs a stack trace pointing at the code that took the connection.
      leak-detection-threshold: 30000
      pool-name: data-sync-hikari
      # DRIVER OPTIONS are set here (not in the JDBC URL) so they still apply when the URL is
      # overridden per environment, e.g. by SPRING_DATASOURCE_URL.
      data-source-properties:
        # Shows up in pg_stat_activity, so this service's connections can be told apart.
        ApplicationName: data-sync-service
        # Seconds. Do not wait forever for an unreachable database host.
        connectTimeout: 10
        # Seconds. A hung database cannot block a thread forever. Set well above the longest
        # legitimate statement, including Flyway migrations that run on startup over this same
        # datasource (e.g. an index build on a large table).
        socketTimeout: 300
        # Lets the driver merge batched single-row INSERTs into multi-row INSERTs (faster upserts).
        # Purely a performance option: results are identical without it, and duplicate keys are
        # already removed in SeriesValueRepositoryAdapter because multi-row ON CONFLICT rejects them.
        reWriteBatchedInserts: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

orion:
  base-url: ${ORION_BASE_URL:https://orion.example.com}
  login: ${ORION_LOGIN:svc-data-sync}
  password: ${ORION_PASSWORD:}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  # Upper bound for honoring an Orion 429 Retry-After header before the next retry attempt.
  max-retry-after: 60s

ledgerpoint:
  base-url: ${LEDGERPOINT_BASE_URL:https://ledgerpoint.example.com}
  api-key: ${LEDGERPOINT_API_KEY:}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  max-batch-size: 10000

datasync:
  sync:
    # Spec 6.9: a series whose Orion lastUpdatedDate is older than this many days fails with STALE_SERIES.
    stale-after-days: 5
  job:
    # A job still RUNNING after this long is assumed orphaned (e.g. crash) and is closed as FAILED
    # so it stops blocking its series type. Keep it well above the longest legitimate job.
    max-running-duration: PT2H
    reaper-interval: PT5M
    reaper-initial-delay: PT1M

resilience4j:
  ratelimiter:
    instances:
      orion:
        limit-for-period: 5
        limit-refresh-period: 1s
        # How long a virtual thread may wait for a permit. All series Tasks of a Job start at once
        # and share 5 permits/second, so waiting time grows with job size (N calls need ~N/5 s).
        # 30m allows ~9,000 queued Orion calls; waiting virtual threads are cheap. If it is still
        # exceeded, the Task fails with SOURCE_UNAVAILABLE instead of staying PENDING.
        timeout-duration: 30m
  retry:
    instances:
      orion:
        max-attempts: 3
        wait-duration: 300ms
        # Item 6: Resilience4j ignores exponential-backoff-multiplier unless this flag is true,
        # which would silently turn the backoff into a fixed 300ms.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.datasync.domain.exception.OrionTransientException
        ignore-exceptions:
          - com.datasync.domain.exception.OrionClientException
          - com.datasync.domain.exception.OrionAuthException
      ledgerpoint:
        max-attempts: 3
        wait-duration: 300ms
        # Item 6: see the orion instance above; same reason.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.datasync.domain.exception.LedgerPointTransientException
        ignore-exceptions:
          - com.datasync.domain.exception.LedgerPointValidationException
          - com.datasync.domain.exception.LedgerPointUnknownSeriesException
          - com.datasync.domain.exception.LedgerPointAuthException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    # cid defaults to n/a so a log line outside any request/job is visibly context-free instead of
    # printing an empty "cid=".
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [cid=%X{correlationId:-n/a} job=%X{jobId} series=%X{seriesName}] %logger{36} - %msg%n"
